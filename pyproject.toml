[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avalauncher"
version = "0.1.0"
description = "Research scaffold for observation-to-scenario comparison in snow avalanche modelling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avalauncher = "avalauncher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
